<svg viewBox="0 0 600 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="wandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4B5FD" />
      <stop offset="35%" stop-color="#8B5CF6" />
      <stop offset="70%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#581C87" />
    </linearGradient>

    <linearGradient id="wandHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="tipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#EDE9FE" />
      <stop offset="100%" stop-color="#C4B5FD" />
    </linearGradient>

    <linearGradient id="mainCardSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FDFBF9" />
    </linearGradient>

    <linearGradient id="backCardSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.96" />
      <stop offset="100%" stop-color="#F5F3FF" stop-opacity="0.92" />
    </linearGradient>

    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FECDD3" />
      <stop offset="50%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>

    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DDD6FE" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>

    <linearGradient id="peachGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE4E6" />
      <stop offset="100%" stop-color="#FDA4AF" />
    </linearGradient>

    <linearGradient id="beamGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FB7185" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#A78BFA" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="sphereGrad1" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#DDD6FE" />
      <stop offset="85%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#4C1D95" />
    </radialGradient>

    <radialGradient id="sphereGradCoral" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFF1F2" />
      <stop offset="45%" stop-color="#FDA4AF" />
      <stop offset="85%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#BE123C" />
    </radialGradient>

    <!-- Filters for 3D Depth & Glow -->
    <filter id="cardShadow" x="-20%" y="-20%" width="145%" height="145%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#7C3AED" flood-opacity="0.09" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.04" />
    </filter>

    <filter id="wandShadow3D" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="4" dy="12" stdDeviation="14" flood-color="#581C87" flood-opacity="0.22" />
    </filter>

    <filter id="coralGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#FB7185" flood-opacity="0.45" />
    </filter>

    <filter id="violetGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#7C3AED" flood-opacity="0.35" />
    </filter>

    <filter id="sparkleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#FFFFFF" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Ambient Ground Shadow / Aura -->
  <ellipse cx="300" cy="430" rx="230" ry="28" fill="#F2EAE1" fill-opacity="0.75" />
  <ellipse cx="290" cy="428" rx="160" ry="18" fill="#E8DDD2" fill-opacity="0.55" />

  <!-- Background Floating Card (Tilted right ~12deg) -->
  <g transform="matrix(0.97, 0.22, -0.22, 0.97, 285, 115)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="195" height="155" rx="22" fill="url(#backCardSurface)" stroke="#DDD6FE" stroke-width="1.6" />
    <!-- Glossy top highlight -->
    <path d="M 0 22 C 0 10 10 0 22 0 L 173 0 C 185 0 195 10 195 22 L 195 45 C 130 50 65 30 0 45 Z" fill="#FFFFFF" fill-opacity="0.6" />
    <!-- Abstract layout rows -->
    <rect x="22" y="24" width="75" height="12" rx="6" fill="#DDD6FE" fill-opacity="0.8" />
    <rect x="22" y="48" width="150" height="8" rx="4" fill="#E5E7EB" />
    <rect x="22" y="64" width="135" height="8" rx="4" fill="#E5E7EB" />
    <rect x="22" y="80" width="142" height="8" rx="4" fill="#E5E7EB" />
    <rect x="22" y="96" width="105" height="8" rx="4" fill="#E5E7EB" />
    <!-- Floating Coral tag badge at bottom -->
    <rect x="22" y="118" width="56" height="16" rx="8" fill="#FFF1F2" stroke="#FECDD3" stroke-width="1" />
    <rect x="30" y="123" width="40" height="6" rx="3" fill="#FB7185" />
  </g>

  <!-- Main Floating Document Card (Tilted left ~-4deg, prominent) -->
  <g transform="matrix(0.998, -0.065, 0.065, 0.998, 85, 80)" filter="url(#cardShadow)">
    <!-- Base card -->
    <rect x="0" y="0" width="280" height="215" rx="26" fill="url(#mainCardSurface)" stroke="#E9D5FF" stroke-width="2" />
    
    <!-- Top Glass Highlight Bar -->
    <path d="M 0 26 C 0 12 12 0 26 0 L 254 0 C 268 0 280 12 280 26 L 280 48 C 180 56 100 36 0 48 Z" fill="#FFFFFF" fill-opacity="0.8" />

    <!-- Card Header Row -->
    <g transform="translate(24, 24)">
      <!-- Violet prompt icon badge (Abstract geometric shape, NO text) -->
      <rect x="0" y="0" width="42" height="42" rx="14" fill="url(#violetGrad)" />
      <!-- Star spark inside badge -->
      <path d="M 21 11 L 23.5 18 L 30 21 L 23.5 24 L 21 31 L 18.5 24 L 12 21 L 18.5 18 Z" fill="#FFFFFF" />

      <!-- Title skeleton lines -->
      <rect x="54" y="9" width="125" height="11" rx="5.5" fill="#C4B5FD" />
      <rect x="54" y="26" width="90" height="8" rx="4" fill="#F3E8FF" />

      <!-- Status dot -->
      <circle cx="218" cy="21" r="5" fill="#FB7185" />
      <circle cx="218" cy="21" r="10" stroke="#FECDD3" stroke-width="1.5" fill="none" opacity="0.6" />
    </g>

    <!-- Card Prompt Body Skeleton Lines (Rich layered opacity) -->
    <g transform="translate(24, 88)">
      <rect x="0" y="0" width="232" height="10" rx="5" fill="#1F2937" fill-opacity="0.82" />
      <rect x="0" y="19" width="215" height="9" rx="4.5" fill="#4B5563" fill-opacity="0.72" />
      <rect x="0" y="36" width="225" height="9" rx="4.5" fill="#6B7280" fill-opacity="0.65" />
      <rect x="0" y="53" width="180" height="9" rx="4.5" fill="#6B7280" fill-opacity="0.45" />
    </g>

    <!-- Card Bottom Badges/Chips (Violet Role + Format + Coral Score) -->
    <g transform="translate(24, 168)">
      <!-- Violet Chip 1 -->
      <rect x="0" y="0" width="56" height="22" rx="11" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1" />
      <rect x="12" y="8" width="32" height="6" rx="3" fill="#7C3AED" />

      <!-- Violet Chip 2 -->
      <rect x="64" y="0" width="60" height="22" rx="11" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1" />
      <rect x="76" y="8" width="36" height="6" rx="3" fill="#8B5CF6" />

      <!-- Coral Chip 3 -->
      <rect x="168" y="0" width="64" height="22" rx="11" fill="#FFF1F2" stroke="#FECDD3" stroke-width="1" />
      <circle cx="178" cy="11" r="3.5" fill="#FB7185" />
      <rect x="187" y="8" width="36" height="6" rx="3" fill="#E11D48" />
    </g>
  </g>

  <!-- 3D Magic Transformation Beam connecting card to wand -->
  <path d="M 230 180 C 270 160 310 190 350 200" stroke="url(#beamGrad)" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.75" />

  <!-- 3D Magic Wand / Stylus (Crossing diagonally towards card) -->
  <g transform="translate(305, 185) rotate(-26)" filter="url(#wandShadow3D)">
    <!-- Wand Body Tube -->
    <rect x="42" y="10" width="175" height="18" rx="9" fill="url(#wandGrad)" />
    <!-- Wand 3D Highlight Strip -->
    <rect x="44" y="11" width="171" height="5" rx="2.5" fill="url(#wandHighlight)" />

    <!-- Wand Ring Grips in Lavender & Coral -->
    <rect x="155" y="8" width="9" height="22" rx="4.5" fill="#DDD6FE" />
    <rect x="170" y="8" width="7" height="22" rx="3.5" fill="#FDA4AF" />
    <rect x="183" y="9" width="7" height="20" rx="3.5" fill="#C4B5FD" />

    <!-- Wand End Cap Sphere -->
    <circle cx="218" cy="19" r="10" fill="url(#sphereGrad1)" />

    <!-- Wand Glowing Tip (Magic Emitter) -->
    <rect x="0" y="8" width="46" height="22" rx="11" fill="url(#tipGrad)" />
    <circle cx="20" cy="19" r="9" fill="#FFFFFF" filter="url(#sparkleGlow)" />

    <!-- Large 8-Point Star at Wand Tip -->
    <g transform="translate(20, 19) scale(1.15)">
      <path d="M 0 -18 L 3.5 -5 L 18 0 L 3.5 5 L 0 18 L -3.5 5 L -18 0 L -3.5 -5 Z" fill="#FFFFFF" filter="url(#sparkleGlow)" />
      <path d="M -9 -9 L -2 -3 L 0 0 L -3 -2 Z M 9 -9 L 2 -3 L 0 0 L 3 -2 Z M 9 9 L 2 3 L 0 0 L 3 2 Z M -9 9 L -2 3 L 0 0 L -3 2 Z" fill="#DDD6FE" />
    </g>
  </g>

  <!-- 3D Floating Geometry & Star Elements (Strictly Violet & Coral/Peach) -->

  <!-- 1. Major 4-Point Coral Sparkle (Upper Right of Wand) -->
  <g transform="translate(295, 145)" filter="url(#coralGlow)">
    <path d="M 14 0 L 17.5 10.5 L 28 14 L 17.5 17.5 L 14 28 L 10.5 17.5 L 0 14 L 10.5 10.5 Z" fill="url(#coralGrad)" />
  </g>

  <!-- 2. Violet Magic Star (Top Left of Main Card) -->
  <g transform="translate(68, 62)" filter="url(#violetGlow)">
    <path d="M 13 0 L 16 9.5 L 26 13 L 16 16.5 L 13 26 L 10 16.5 L 0 13 L 10 9.5 Z" fill="url(#violetGrad)" />
  </g>

  <!-- 3. Soft Coral Star (Bottom Right) -->
  <g transform="translate(480, 275)" filter="url(#coralGlow)">
    <path d="M 11 0 L 13.5 8 L 22 11 L 13.5 14 L 11 22 L 8.5 14 L 0 11 L 8.5 8 Z" fill="url(#coralGrad)" />
  </g>

  <!-- 4. Floating 3D Violet Sphere (Smooth Studio Clay Shading) -->
  <circle cx="490" cy="180" r="14" fill="url(#sphereGrad1)" filter="url(#cardShadow)" />
  <ellipse cx="486" cy="174" rx="4" ry="2.5" fill="#FFFFFF" fill-opacity="0.8" />

  <!-- 5. Floating 3D Coral Sphere (Small, cute accent) -->
  <circle cx="85" cy="310" r="11" fill="url(#sphereGradCoral)" filter="url(#cardShadow)" />
  <ellipse cx="82" cy="306" rx="3" ry="2" fill="#FFFFFF" fill-opacity="0.85" />

  <!-- 6. Floating Magic Sparkle Points -->
  <circle cx="240" cy="55" r="4.5" fill="#FDA4AF" opacity="0.9" />
  <circle cx="410" cy="115" r="3.5" fill="#DDD6FE" opacity="0.95" />
  <circle cx="340" cy="245" r="4" fill="#FB7185" opacity="0.8" />
  <circle cx="170" cy="320" r="3.5" fill="#C4B5FD" opacity="0.7" />
  <circle cx="530" cy="225" r="5" fill="#FBCFE8" opacity="0.85" />
  <circle cx="430" cy="350" r="3.5" fill="#FB7185" opacity="0.6" />
</svg>
